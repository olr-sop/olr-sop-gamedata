schema: spec-driven

context: |
  OLR is the game runtime and gamedata for Oblivion Lost Remake (X-Ray 1.6,
  Lua 5.1, LTX/XML, HLSL shaders).
  Read AGENTS.md first. Text under gamedata/** is Windows-1251, except
  gamedata/shaders/** and gamedata/config/text/eng/**, which are UTF-8.
  XML declarations must match the bytes because TinyXML reads them. Use
  tools/encoding/enc.ps1 for reading, searching, conversion, XML declaration repair
  and damage recovery; direct UTF-8 writes to CP1251 areas are forbidden.
  Requirements and specs are written in English; proposals, design notes and tasks
  may be Russian.
  OpenSpec is the behavior baseline for large or contract-changing work; small
  local features, fixes, small refactors and config/text work are tracked in git.
  Start every task with the spec preflight in AGENTS.md, including git-only work.
  The user runs the game and luac by default. An agent runs them only when the
  user explicitly asks for that specific command. Use the cbm-gamedata MCP server
  (graph project Q-OLRDev-OLR) and lemma as supporting tools. OpenSpec
  remains the source of truth for scope and acceptance.

rules:
  proposal:
    - "State which gamedata areas change: scripts, config, shaders, spawn, assets."
    - "Call out encoding impact and any text that must be restored from a reference source."
    - "Classify the work as OpenSpec or git-only; for OpenSpec, state why it is large, risky, cross-cutting or contract-changing."
  specs:
    - "Write requirements in English, one behavior per Requirement, each with at least one Scenario."
    - "For script APIs, name the engine export used (script_*_script.cpp) when relevant."
    - "Only OpenSpec work updates specs; git-only work must not edit openspec/specs/."
  design:
    - "Document LTX inheritance/include chains and save-load compatibility for script changes."
    - "For encoding work, state source encoding, target encoding and the verification command."
  tasks:
    - "Encoding tasks must use tools/encoding/enc.ps1 and end with a clean scan of touched files."
    - "Group tasks by area (scripts, config, shaders, spawn) and keep each verifiable."
    - "Every task states its verification."
    - "The final task states who runs the game or luac: the user by default, or the agent only when explicitly asked."

operations:
  apply:
    guidance:
      - "Do not create a change for a small local fix, config value or text edit; record it in the git commit instead."
      - "If git-only work grows or changes a documented requirement or config semantic, stop and create a full change."
      - "After editing text, run tools/encoding/enc.ps1 detect on every touched file, including git-only work."
      - "Never mass-convert files outside the change scope."
  archive:
    guidance:
      - "Summarize the user-visible gameplay or UI effect and how it was verified."
